name: Native Windows x64 build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - shell: powershell
        run: ./build.ps1
      - shell: powershell
        run: |
          cl.exe /nologo /utf-8 /EHsc /std:c++17 /Ivendor/nlohmann /Inative tests/native_catalog.cpp /Fe:build/native-catalog-tests.exe
          if ($LASTEXITCODE -ne 0) { throw 'Catalog test build failed' }
          ./build/native-catalog-tests.exe
          if ($LASTEXITCODE -ne 0) { throw 'Catalog tests failed' }
          cl.exe /nologo /utf-8 /LD /MT /DLOADER_FORWARD_TEST /D_WIN64 /D_WIN32_WINNT=0x0602 native/loader.c /link /OUT:build/test-powrprof.dll user32.lib
          if ($LASTEXITCODE -ne 0) { throw 'Loader test build failed' }
          cl.exe /nologo tests/PowerLoaderTests.c /Fe:build/PowerLoaderTests.exe
          if ($LASTEXITCODE -ne 0) { throw 'Loader test harness build failed' }
          ./build/PowerLoaderTests.exe
          if ($LASTEXITCODE -ne 0) { throw 'Loader tests failed' }
      - shell: powershell
        run: python package.py
      - uses: actions/upload-artifact@v4
        with:
          name: SkySpiritExporter-v0.3.0-native-windows-x64
          path: |
            dist/native/SkySpiritExporter-v0.3.0-native-windows-x64.zip
            dist/native/SHA256SUMS-v0.3.0.txt
